
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Reasons I Love You ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffe0e9, #ffc2d1);
    color: #8b1745;
    padding: 20px;
}

.container {
    background: white;
    padding: 35px 25px;
    border-radius: 25px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 35px #d8759580;
}

.heart {
    font-size: 60px;
    animation: heartbeat 1.2s infinite;
}

h1 {
    font-size: 30px;
    margin: 15px 0;
}

.subtitle {
    color: #b45b7b;
    font-size: 16px;
}

.reason-box {
    background: #fff0f5;
    border-radius: 18px;
    padding: 25px 15px;
    margin: 25px 0;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.reason-number {
    font-size: 14px;
    color: #d65b87;
    margin-bottom: 15px;
}

.reason {
    font-size: 23px;
    line-height: 1.5;
}

button {
    background: #e75480;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #c92c61;
    transform: scale(1.05);
}

.footer {
    margin-top: 25px;
    font-size: 14px;
    color: #c46b8b;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>100 Reasons<br>I Love You</h1>

    <p class="subtitle">

    </p>

    </div>

    <button onclick="showReason()">
        Click for a Reason 💕
    </button>

    <div class="footer">
        Made with all my heart, just for you ❤️
    </div>

</div>

let current = 0;

function showReason() {

    if (current < reasons.length) {

        document.getElementById("number").innerText =
        "Reason " + (current + 1) + " of 100 💌";

        document.getElementById("reason").innerText =
        reasons[current];

        current++;

    } else {

        document.getElementById("number").innerText =
        "One last thing 💖";

        document.getElementById("reason").innerText =
        "No matter how many reasons I write, they will never be enough to explain how much I love you.";

        document.querySelector("button").innerText =
        "I Love You ❤️";

    }

}

</script>
